<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farkle Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a dark baize table on the left (dice, turn score, actions), a brass scoreboard on the right; stacks on phones. */
:root {
  --table: #0e1a1d;
  --table-2: #152428;
  --line: #28393d;
  --ivory: #f3ecd9;
  --ivory-dim: #a9a590;
  --brass: #d1a84a;
  --ember: #e4573b;
  --ink: #1b1a17;
  --good: #7fc88a;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--table);
  color: var(--ivory);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 34px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand b { color: var(--brass); font-weight: 900; }
.label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.code { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .12em; color: var(--brass); }

.btn { border: 0; border-radius: 6px; padding: 12px 20px; font-weight: 700; background: var(--brass); color: var(--ink); min-height: 46px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ivory); border: 1.5px solid var(--line); }
.btn.hot { background: var(--ember); color: #fff; }
.btn.small { padding: 8px 14px; min-height: 36px; font-size: 13px; }

.panel { background: var(--table-2); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.home { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.home h2, .lobby h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
input[type=text], select {
  background: var(--table); color: var(--ivory); border: 1.5px solid var(--line); border-radius: 6px;
  padding: 11px 12px; font: inherit; min-height: 46px; width: 100%; min-width: 0;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ivory-dim); }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.banner { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.banner h2 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 6vw, 44px); text-transform: uppercase; line-height: 1; }
.banner h2.mine { color: var(--brass); }
.turnscore { text-align: right; }
.turnscore .n { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.dice { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 3vw, 18px); max-width: 420px; margin: 0 auto 22px; padding: 8px 0 14px; }
@media (min-width: 640px) { .dice { grid-template-columns: repeat(6, 1fr); max-width: none; } }
.die {
  aspect-ratio: 1; width: 100%; max-width: 96px; margin: 0 auto; border: 0; border-radius: 16%;
  background: linear-gradient(145deg, #fbf5e3, #e0d7bb); padding: 13%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%;
  box-shadow: 0 6px 0 #a89f7e, 0 12px 18px rgba(0,0,0,.45);
  transition: transform .15s, box-shadow .15s;
}
.die i { border-radius: 50%; }
.die i.on { background: var(--ink); box-shadow: inset 0 2px 2px rgba(0,0,0,.5); }
.die:disabled { cursor: default; }
.die.free:not(:disabled):hover { transform: translateY(-4px); }
.die.sel { transform: translateY(-10px); box-shadow: 0 0 0 4px var(--brass), 0 16px 20px rgba(0,0,0,.5); }
.die.held { background: linear-gradient(145deg, #8f7b45, #6d5d33); box-shadow: 0 6px 0 #4a3f22, 0 12px 18px rgba(0,0,0,.45); }
.die.held i.on { background: #2a2210; }
.die.blank { opacity: .35; }
.die.bust { box-shadow: 0 0 0 4px var(--ember), 0 12px 18px rgba(0,0,0,.45); }
.die.tumble { animation: tumble .55s cubic-bezier(.3,.7,.3,1); }
@keyframes tumble {
  0% { transform: translateY(-40px) rotate(-200deg) scale(.7); opacity: 0; }
  60% { transform: translateY(4px) rotate(18deg) scale(1.04); opacity: 1; }
  100% { transform: none; }
}
@media (prefers-reduced-motion: reduce) { .die.tumble { animation: none; } .die { transition: none; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { margin-top: 12px; min-height: 22px; }
.hint.bad { color: var(--ember); }
.hint.ok { color: var(--good); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.board { display: flex; flex-direction: column; gap: 8px; list-style: none; padding: 0; margin: 12px 0 0; }
.p { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--table); }
.p.turn { border-color: var(--brass); box-shadow: inset 4px 0 0 var(--brass); }
.p .nm { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.p .sc { font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--brass); }
.p .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.p .bar span { display: block; height: 100%; background: var(--brass); }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ivory-dim); margin-left: 6px; font-weight: 700; }
.log { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ivory-dim); }
.log li:last-child { color: var(--ivory); }
details { margin-top: 14px; }
summary { cursor: pointer; font-weight: 700; }
.rules { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--ivory-dim); display: flex; flex-direction: column; gap: 3px; }
.invite { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.invite input { flex: 1 1 220px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ivory); color: var(--ink); padding: 10px 16px; border-radius: 8px; font-weight: 700; max-width: calc(100vw - 32px); z-index: 20; }
.winner { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 8vw, 64px); text-transform: uppercase; color: var(--brass); line-height: 1; }

@media (max-width: 820px) {
  .home, .game { grid-template-columns: minmax(0, 1fr); }
  .game .side { order: -1; }
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Farkle <b>Night</b></div>
    <div id="topright"></div>
  </div>
  <div id="warn"></div>
  <div id="view"><div class="panel muted">Connecting…</div></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- Farkle rules ---------- */
  var MIN_ENTRY = 1000;
  var FULL_HOUSE = 1500;   // three of a kind plus a pair, all five dice set aside together
  function counts(vals) { var c = [0, 0, 0, 0, 0, 0, 0]; vals.forEach(function (v) { c[v]++; }); return c; }
  // Scores a chosen set of dice. valid = every chosen die contributes to the score.
  function scoreSel(vals) {
    if (!vals.length) return { score: 0, valid: false };
    var c = counts(vals), n = vals.length, score = 0, v, w;
    if (n === 6 && c.slice(1).every(function (x) { return x === 1; })) return { score: 1500, valid: true };
    var pairs = c.slice(1).filter(function (x) { return x === 2; }).length;
    if (n === 6 && pairs === 3) return { score: 1500, valid: true };
    var best = { score: 0, valid: false };
    var plain = true;
    for (v = 1; v <= 6; v++) {
      if (c[v] >= 3) {
        var base = v === 1 ? 1000 : v * 100;
        score += base * Math.pow(2, c[v] - 3);
      } else if (v === 1) score += c[v] * 100;
      else if (v === 5) score += c[v] * 50;
      else if (c[v] > 0) { plain = false; break; }
    }
    if (plain) best = { score: score, valid: true };
    // Full house: three of a kind plus a pair (the pair does not have to score on its own).
    // A leftover sixth die counts only if it is a 1 or a 5.
    if (n === 5 || n === 6) {
      for (v = 1; v <= 6; v++) {
        if (c[v] < 3) continue;
        for (w = 1; w <= 6; w++) {
          if (w === v || c[w] < 2) continue;
          var left = c.slice(); left[v] -= 3; left[w] -= 2;
          var extra = 0, ok = true, k;
          for (k = 1; k <= 6; k++) {
            if (!left[k]) continue;
            if (left[k] === 1 && k === 1) extra += 100;
            else if (left[k] === 1 && k === 5) extra += 50;
            else ok = false;
          }
          if (ok && FULL_HOUSE + extra > best.score) best = { score: FULL_HOUSE + extra, valid: true };
        }
      }
    }
    return best;
  }
  function hasScore(vals) {
    var c = counts(vals), v;
    if (c[1] || c[5]) return true;
    for (v = 2; v <= 6; v++) if (c[v] >= 3) return true;
    // A full house always contains a triple, which is already caught above.
    if (vals.length === 6) {
      if (c.slice(1).every(function (x) { return x === 1; })) return true;
      if (c.slice(1).filter(function (x) { return x === 2; }).length === 3) return true;
    }
    return false;
  }
  // Highest-scoring valid set of the dice still in play. On a tie, keep fewer dice so more stay in play.
  function bestSel(r) {
    var free = [], i, m;
    for (i = 0; i < 6; i++) if (!r.held[i]) free.push(i);
    var best = null;
    for (m = 1; m < (1 << free.length); m++) {
      var idxs = free.filter(function (_, k) { return m & (1 << k); });
      var sc = scoreSel(idxs.map(function (j) { return r.dice[j]; }));
      if (sc.valid && sc.score > 0 && (!best || sc.score > best.score || (sc.score === best.score && idxs.length < best.idxs.length))) best = { score: sc.score, idxs: idxs };
    }
    return best ? best.idxs : [];
  }
  var rollDie = function () { return 1 + Math.floor(Math.random() * 6); };
  var PIPS = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  /* ---------- state ---------- */
  var db = null;
  var uid = null, myName = store.get("fk-name") || "";
  var code = null, room = null, players = {}, roomLoaded = false, subErr = null;
  var unsubs = [], busy = false, joining = false, seenRoll = null, animate = false;
  var sel = new Set(), selKey = "", autoPick = store.get("fk-auto") === "1";
  var toastT = null, loadT = null, canWrite = null, joinErr = false;

  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3800);
  }
  function writeFail(e) {
    var c = e && e.code;
    toast(c === "permission-denied"
      ? "That move isn't allowed right now."
      : "Couldn't reach the table. Check your connection and try again.");
  }
  function genCode() {
    var a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", s = "", i;
    for (i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  function nameOf(id) { return (players[id] && players[id].name) || "Someone"; }
  function mineTurn(r) { return r.order[r.turn] === uid; }
  /* ---------- routing / subscriptions ---------- */
  function parseHash() {
    var m = /^#t-([A-Za-z0-9]{3,8})$/.exec(location.hash || "");
    return m ? m[1].toUpperCase() : null;
  }
  function unsubAll() { unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = []; }
  function route() {
    var c = parseHash();
    if (c === code && (c === null || unsubs.length)) { render(); return; }
    unsubAll();
    code = c; room = null; players = {}; roomLoaded = false; subErr = null; seenRoll = null; sel = new Set(); joining = false;
    if (code && db) subscribe();
    render();
  }
  function subscribe() {
    var rref = db.doc("rooms/" + code);
    clearTimeout(loadT);
    loadT = setTimeout(function () { if (!roomLoaded) { subErr = { code: "slow" }; render(); } }, 10000);
    unsubs.push(rref.onSnapshot(function (s) {
      roomLoaded = true; subErr = null; clearTimeout(loadT);
      room = s.exists ? s.data() : null;
      if (room) {
        if (seenRoll === null) seenRoll = room.rollId || 0;
        else if ((room.rollId || 0) !== seenRoll) { seenRoll = room.rollId || 0; animate = true; }
        var key = (room.turn) + ":" + (room.rollId || 0);
        if (key !== selKey) {
          selKey = key; sel = new Set();
          if (autoPick && room.phase === "choose" && room.order[room.turn] === uid) sel = new Set(bestSel(room));
        }
      }
      maybeJoin(); hostSync(); render();
    }, function (e) { subErr = e; render(); }));
    unsubs.push(rref.collection("players").onSnapshot(function (q) {
      var m = {}; q.docs.forEach(function (d) { m[d.id] = d.data(); });
      players = m; hostSync(); render();
    }, function () {}));
  }
  function uniqueName(n) {
    var taken = Object.keys(players).map(function (i) { return String(players[i].name).toLowerCase(); });
    var out = n, k = 2;
    while (taken.indexOf(out.toLowerCase()) > -1) out = n + " " + k++;
    return out;
  }
  function maybeJoin() {
    if (!room || room.status === "done" || !myName || players[uid] || joining || joinErr || canWrite === false) return;
    joining = true;
    db.doc("rooms/" + code + "/players/" + uid).set({ name: uniqueName(myName), joined: Date.now() })
      .catch(function (e) { joining = false; joinErr = true; writeFail(e); render(); });
  }

  // The host adds anyone who sits down after the game has started to the end of the turn order.
  function hostSync() {
    if (!room || room.status !== "play" || room.host !== uid || busy) return;
    var missing = Object.keys(players).filter(function (i) { return room.order.indexOf(i) < 0; })
      .sort(function (a, b) { return (players[a].joined || 0) - (players[b].joined || 0); });
    if (!missing.length) return;
    var patch = {
      order: room.order.concat(missing),
      log: pushLog(room, missing.map(nameOf).join(", ") + " joined the game.")
    };
    // Dotted paths merge into the scores map instead of replacing it.
    missing.forEach(function (i) { patch["scores." + i] = 0; });
    act(db.doc("rooms/" + code).update(patch));
  }

  /* ---------- actions ---------- */
  async function createTable() {
    if (!myName) return;
    var c = genCode();
    try {
      await db.doc("rooms/" + c).set({ host: uid, status: "lobby", target: 10000, created: Date.now() });
      await db.doc("rooms/" + c + "/players/" + uid).set({ name: myName, joined: Date.now() });
      location.hash = "t-" + c; route();
    } catch (e) { writeFail(e); }
  }
  function startGame() {
    var ids = Object.keys(players).sort(function (a, b) { return (players[a].joined || 0) - (players[b].joined || 0); });
    if (!ids.length) return;
    var scores = {}; ids.forEach(function (i) { scores[i] = 0; });
    act(db.doc("rooms/" + code).update({
      status: "play", order: ids, scores: scores, turn: 0, dice: [], held: [false, false, false, false, false, false],
      turnScore: 0, phase: "roll", rollId: 0, finalFrom: -1, winner: null,
      log: ["Game on. " + nameOf(ids[0]) + " rolls first."]
    }));
  }
  function act(p) {
    if (busy) return; busy = true;
    return Promise.resolve(p).catch(writeFail).then(function () { busy = false; render(); });
  }
  function pushLog(r, line) { return (r.log || []).concat([line]).slice(-8); }
  function endTurn(r, scores, finalFrom, log) {
    var next = (r.turn + 1) % r.order.length;
    if (finalFrom >= 0 && next === finalFrom) {
      var best = r.order[0];
      r.order.forEach(function (i) { if (scores[i] > scores[best]) best = i; });
      return { status: "done", scores: scores, finalFrom: finalFrom, winner: best, phase: "done", dice: r.dice, turnScore: 0, log: log.concat([nameOf(best) + " wins with " + scores[best] + "."]).slice(-8) };
    }
    return { scores: scores, finalFrom: finalFrom, turn: next, dice: [], held: [false, false, false, false, false, false], turnScore: 0, phase: "roll", log: log };
  }
  function rollFrom(r, held, turnScore, log) {
    var h = held.slice(), hot = false, i;
    if (h.every(Boolean)) { h = [false, false, false, false, false, false]; hot = true; }
    var dice = r.dice.length ? r.dice.slice() : [1, 1, 1, 1, 1, 1];
    var free = [];
    for (i = 0; i < 6; i++) if (!h[i]) { dice[i] = rollDie(); free.push(dice[i]); }
    var who = nameOf(r.order[r.turn]);
    if (!hasScore(free)) {
      return { dice: dice, held: h, turnScore: 0, phase: "farkle", rollId: (r.rollId || 0) + 1, log: pushLog({ log: log }, "FARKLE. " + who + " loses " + turnScore + "." ) };
    }
    return { dice: dice, held: h, turnScore: turnScore, phase: "choose", rollId: (r.rollId || 0) + 1, log: hot ? pushLog({ log: log }, who + " has hot dice and rolls all six.") : log };
  }
  function doRoll() {
    var r = room; if (!mineTurn(r) || r.phase !== "roll") return;
    act(db.doc("rooms/" + code).update(rollFrom(r, r.held, 0, r.log || [])));
  }
  function commit(kind) {
    var r = room; if (!mineTurn(r) || r.phase !== "choose") return;
    var idxs = Array.from(sel), s = scoreSel(idxs.map(function (i) { return r.dice[i]; }));
    if (!s.valid || s.score <= 0) return;
    var held = r.held.slice(); idxs.forEach(function (i) { held[i] = true; });
    var cur = r.order[r.turn], total = r.turnScore + s.score, me = nameOf(cur);
    if (kind === "bank") {
      if (!(r.scores[cur] > 0) && total < MIN_ENTRY) return;
      var newScore = (r.scores[cur] || 0) + total;
      if (newScore > r.target) return;   // must land exactly on the target
      var scores = Object.assign({}, r.scores); scores[cur] = newScore;
      var log = pushLog(r, me + " banks " + total + ".");
      if (newScore === r.target) {
        act(db.doc("rooms/" + code).update({
          status: "done", phase: "done", winner: cur, scores: scores, turnScore: 0, dice: r.dice, held: held,
          log: pushLog({ log: log }, me + " lands exactly on " + r.target.toLocaleString() + " and wins.")
        }));
      } else {
        act(db.doc("rooms/" + code).update(endTurn(r, scores, -1, log)));
      }
    } else {
      act(db.doc("rooms/" + code).update(rollFrom(r, held, total, r.log || [])));
    }
  }
  function pass(reason) {
    var r = room;
    var log = pushLog(r, reason === "skip" ? nameOf(r.order[r.turn]) + " was skipped." : nameOf(r.order[r.turn]) + " passes the dice.");
    act(db.doc("rooms/" + code).update(endTurn(r, r.scores, r.finalFrom, log)));
  }
  function playAgain() {
    act(db.doc("rooms/" + code).update({ status: "lobby", phase: "roll", dice: [], winner: null, finalFrom: -1, log: [] }));
  }
  function setTarget(v) { act(db.doc("rooms/" + code).update({ target: Number(v) })); }

  /* ---------- rendering ---------- */
  function dieHTML(v, cls, i, dis) {
    var cells = "", k, on = PIPS[v] || [];
    for (k = 0; k < 9; k++) cells += '<i class="' + (on.indexOf(k) > -1 ? "on" : "") + '"></i>';
    return '<button class="die ' + cls + '" data-act="die" data-i="' + i + '"' + (dis ? " disabled" : "") +
      ' aria-label="Die ' + (i + 1) + (v ? ", showing " + v : ", not rolled") + '">' + cells + "</button>";
  }
  function inviteHTML() {
    return '<div class="invite"><input type="text" id="link" readonly value="' + esc(location.href) + '" aria-label="Table link">' +
      '<button class="btn small" data-act="copy">Copy link</button></div>';
  }
  function rulesHTML() {
    return '<details><summary>How scoring works</summary><ul class="rules">' +
      "<li>Roll six dice. Set aside at least one scoring die, then roll the rest or bank.</li>" +
      "<li>Single 1 = 100. Single 5 = 50.</li>" +
      "<li>Three of a kind = number × 100 (three 1s = 1000). Each extra die doubles it.</li>" +
      "<li>Straight 1–6 or three pairs = 1500.</li>" +
      "<li>Full house (three of a kind plus a pair, all five dice set aside together) = " + FULL_HOUSE.toLocaleString() + ". You can then roll the last die.</li>" +
      "<li>Score all six dice and you roll all six again (hot dice).</li>" +
      "<li>No scoring dice on a roll is a Farkle: you lose the turn's points.</li>" +
      "<li>You need " + MIN_ENTRY.toLocaleString() + " in one turn to get on the board.</li>" +
      "<li>You must finish on the exact target. You can't bank a turn that would go over it. Keep rolling, or risk a Farkle.</li></ul></details>";
  }
  function render() {
    var v = $("#view"), tr = $("#topright");
    $("#warn").innerHTML = (canWrite === false || joinErr)
      ? '<div class="panel" style="border-color:var(--ember)"><h2 style="font-family:var(--font-display);font-size:26px;text-transform:uppercase;margin-bottom:6px">You can watch, but not play</h2><p class="muted">Couldn\'t save your seat at the table. Check your connection and reload the page.</p></div>'
      : "";
    if (!db) { tr.innerHTML = ""; v.innerHTML = '<div class="panel"><h2>Can\'t connect</h2><p class="muted">The game couldn\'t reach Firebase. Check public/firebase-config.js and that Anonymous sign-in is turned on.</p></div>'; return; }
    tr.innerHTML = code ? '<span class="label">Table </span><span class="code">' + esc(code) + "</span>" : "";
    if (!code) { v.innerHTML = homeHTML(); return; }
    if (subErr) { v.innerHTML = '<div class="panel"><h2>Can\'t reach the table</h2><p class="muted">' + (subErr.code === "slow" ? "Still waiting for the table to answer. It may load in a moment." : "You may not have access to this page.") + '</p><div class="row" style="margin-top:14px"><a class="btn ghost" href="#">Back</a></div></div>'; return; }
    if (!roomLoaded) { v.innerHTML = '<div class="panel muted">Finding table ' + esc(code) + "…</div>"; return; }
    if (!room) { v.innerHTML = '<div class="panel"><h2>No table ' + esc(code) + '</h2><p class="muted">Check the code, or start a new table.</p><div class="row" style="margin-top:14px"><button class="btn" data-act="home">Back</button></div></div>'; return; }
    if (!myName) { v.innerHTML = nameGate(); return; }
    v.innerHTML = room.status === "lobby" ? lobbyHTML() : gameHTML();
    animate = false;
  }
  function homeHTML() {
    return '<div class="home"><div class="panel"><h2>New table</h2><p class="muted" style="margin-bottom:16px">Start a game and send the link to your friends.</p>' +
      '<div class="field"><label class="label" for="nm">Your name</label><input type="text" id="nm" maxlength="20" value="' + esc(myName) + '" autocomplete="nickname"></div>' +
      '<button class="btn" data-act="create">Create table</button></div>' +
      '<div class="panel"><h2>Join a table</h2><p class="muted" style="margin-bottom:16px">Got a code from a friend? Or just open their link.</p>' +
      '<div class="field"><label class="label" for="jc">Table code</label><input type="text" id="jc" maxlength="8" placeholder="K7M2" autocapitalize="characters"></div>' +
      '<button class="btn ghost" data-act="join">Join</button></div></div>' + '<div class="panel">' + rulesHTML() + "</div>";
  }
  function nameGate() {
    return '<div class="panel" style="max-width:460px"><h2 style="font-family:var(--font-display);font-size:28px;text-transform:uppercase;margin-bottom:10px">What should we call you?</h2>' +
      '<div class="field"><label class="label" for="nm">Your name</label><input type="text" id="nm" maxlength="20" autocomplete="nickname"></div>' +
      '<button class="btn" data-act="setname">Sit down</button></div>';
  }
  function lobbyHTML() {
    var ids = Object.keys(players).sort(function (a, b) { return (players[a].joined || 0) - (players[b].joined || 0); });
    var isHost = room.host === uid;
    var list = ids.map(function (i) {
      return '<li class="p"><span class="nm">' + esc(players[i].name) + (i === uid ? '<span class="tag">you</span>' : "") + (i === room.host ? '<span class="tag">host</span>' : "") + "</span></li>";
    }).join("");
    return '<div class="panel lobby"><h2>Waiting for players</h2><p class="muted">Share this link. Players appear as they open it.</p>' + inviteHTML() +
      '<ul class="board">' + list + "</ul>" +
      '<div class="row" style="margin-top:18px">' +
      (isHost
        ? '<label class="label" for="tg">Play to</label><select id="tg" data-act="target" style="width:auto">' +
          [3000, 5000, 10000].map(function (t) { return '<option value="' + t + '"' + (room.target === t ? " selected" : "") + ">" + t.toLocaleString() + "</option>"; }).join("") +
          '</select><button class="btn" data-act="start"' + (ids.length ? "" : " disabled") + ">Start game</button>"
        : '<span class="muted">Playing to ' + room.target.toLocaleString() + ". Waiting for " + esc(nameOf(room.host)) + " to start.</span>") +
      "</div>" + rulesHTML() + "</div>";
  }
  function gameHTML() {
    var r = room, cur = r.order[r.turn], mine = mineTurn(r), done = r.status === "done";
    var inGame = r.order.indexOf(uid) > -1 || r.host === uid;
    var selIdx = Array.from(sel), s = scoreSel(selIdx.map(function (i) { return r.dice[i]; }));
    var total = r.turnScore + (s.valid ? s.score : 0);
    var freeCount = r.held.filter(function (h) { return !h; }).length;
    var canPick = mine && r.phase === "choose" && !busy;

    var dice = "";
    for (var i = 0; i < 6; i++) {
      var val = r.dice[i] || 0, held = r.held[i];
      var cls = held ? "held" : "free";
      if (!r.dice.length) cls += " blank";
      if (sel.has(i)) cls += " sel";
      if (r.phase === "farkle" && !held) cls += " bust";
      if (animate && !held && r.dice.length) cls += " tumble";
      dice += dieHTML(val, cls, i, !(canPick && !held));
    }

    var controls = "", hint = "", hintCls = "", tools = "";
    if (done) {
      controls = r.host === uid || room.host === uid ? '<button class="btn" data-act="again">Play again</button>' : '<span class="muted">Waiting for the host to start another game.</span>';
    } else if (!inGame) {
      hint = (canWrite === false || joinErr) ? "You're watching live. The host can add you as a player on their device." : "Joining the game. The host's screen adds you in a moment. If this stays, ask the host to keep the page open.";
    } else if (mine && r.phase === "roll") {
      controls = '<button class="btn" data-act="roll"' + (busy ? " disabled" : "") + ">Roll six dice</button>";
    } else if (mine && r.phase === "choose") {
      var rest = freeCount - selIdx.length, entryOk = (r.scores[cur] > 0) || total >= MIN_ENTRY;
      var over = (r.scores[cur] || 0) + total > r.target;
      controls = '<button class="btn" data-act="keeproll"' + (s.valid && s.score > 0 && !busy ? "" : " disabled") + ">" + (rest === 0 && s.valid ? "Hot dice: roll all 6" : "Set aside, roll " + Math.max(rest, 0)) + "</button>" +
        '<button class="btn ghost" data-act="bank"' + (s.valid && s.score > 0 && entryOk && !over && !busy ? "" : " disabled") + ">Bank " + total.toLocaleString() + "</button>";
      tools = '<div class="tools"><button class="btn ghost small" data-act="autopick"' + (busy ? " disabled" : "") + '>Pick best dice</button>' +
        '<button class="btn ghost small" data-act="autotoggle" aria-pressed="' + autoPick + '">Auto-pick each roll: ' + (autoPick ? "on" : "off") + "</button></div>";
      if (!selIdx.length) hint = "Tap the scoring dice you want to keep, or use Pick best dice.";
      else if (!s.valid) { hint = "Every die you keep must score."; hintCls = "bad"; }
      else { hint = "Keeping these is worth " + s.score + "."; hintCls = "ok"; if (!entryOk) hint += " You need " + MIN_ENTRY.toLocaleString() + " in a turn to get on the board."; if (over) { hint = "Banking this would go over " + r.target.toLocaleString() + ". You have to land exactly on it."; hintCls = "bad"; } else if ((r.scores[cur] || 0) + total === r.target) { hint += " That's exactly " + r.target.toLocaleString() + ". Bank it to win."; } }
    } else if (mine && r.phase === "farkle") {
      controls = '<button class="btn hot" data-act="pass"' + (busy ? " disabled" : "") + ">Farkle. Pass the dice</button>";
    } else {
      hint = r.phase === "farkle" ? esc(nameOf(cur)) + " farkled." : esc(nameOf(cur)) + " is thinking…";
    }
    if (!done && room.host === uid && !mine) controls += '<button class="btn ghost small" data-act="skip">Skip ' + esc(nameOf(cur)) + "</button>";

    var board = r.order.map(function (i) {
      var sc = r.scores[i] || 0, pct = Math.min(100, Math.round(sc / r.target * 100));
      return '<li class="p' + (i === cur && !done ? " turn" : "") + '"><span class="nm">' + esc(nameOf(i)) + (i === uid ? '<span class="tag">you</span>' : "") + '</span><span class="sc">' + sc.toLocaleString() + '</span><span class="bar"><span style="width:' + pct + '%"></span></span></li>';
    }).join("");
    var log = (r.log || []).map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("");

    var head = done
      ? '<div><p class="label">Winner</p><div class="winner">' + esc(nameOf(r.winner)) + "</div></div>"
      : '<div><p class="label">' + (mine ? "Your turn" : "Now playing") + '</p><h2 class="' + (mine ? "mine" : "") + '">' + (mine ? "Roll them" : esc(nameOf(cur))) + "</h2></div>" +
        '<div class="turnscore"><p class="label">This turn</p><div class="n">' + (r.phase === "choose" ? total : r.turnScore).toLocaleString() + "</div></div>";
    var last = "";

    return '<div class="game"><div class="panel"><div class="banner">' + head + "</div>" +
      '<div class="dice">' + dice + "</div>" +
      '<div class="actions">' + controls + "</div>" +
      '<p class="hint ' + hintCls + '" role="status">' + hint + "</p>" + tools + last + "</div>" +
      '<div class="panel side"><p class="label">Race to ' + r.target.toLocaleString() + ' exactly</p><ul class="board">' + board + '</ul><ul class="log">' + log + "</ul>" + rulesHTML() + "</div></div>";
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "die") {
      var i = Number(el.getAttribute("data-i"));
      if (sel.has(i)) sel.delete(i); else sel.add(i);
      render();
    } else if (a === "create") { var n = $("#nm"); myName = n.value.trim(); if (!myName) { n.focus(); return; } store.set("fk-name", myName); createTable(); }
    else if (a === "join") { var c = $("#jc").value.trim().toUpperCase(); var nm = $("#nm") ? $("#nm").value.trim() : ""; if (nm) { myName = nm; store.set("fk-name", nm); } if (c) location.hash = "t-" + c; }
    else if (a === "setname") { var v = $("#nm").value.trim(); if (!v) return; myName = v; store.set("fk-name", v); maybeJoin(); render(); }
    else if (a === "autopick") { if (room && mineTurn(room) && room.phase === "choose") { sel = new Set(bestSel(room)); render(); } }
    else if (a === "autotoggle") {
      autoPick = !autoPick; store.set("fk-auto", autoPick ? "1" : "0");
      if (autoPick && room && mineTurn(room) && room.phase === "choose" && !sel.size) sel = new Set(bestSel(room));
      render();
    }
    else if (a === "start") startGame();
    else if (a === "roll") doRoll();
    else if (a === "keeproll") commit("roll");
    else if (a === "bank") commit("bank");
    else if (a === "pass") pass();
    else if (a === "skip") pass("skip");
    else if (a === "again") playAgain();
    else if (a === "home") { location.hash = ""; route(); }
    else if (a === "copy") {
      var inp = $("#link");
      try { navigator.clipboard.writeText(location.href).then(function () { toast("Link copied"); }, function () { inp.select(); toast("Press copy on the selected link"); }); }
      catch (err) { inp.select(); toast("Press copy on the selected link"); }
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "tg") setTarget(e.target.value);
  });
  window.addEventListener("hashchange", route);

  /* ---------- boot ---------- */
  async function init() {
    render();
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      var emu = /[?&]emulator=1/.test(location.search);
      if (emu) firebase.auth().useEmulator("http://127.0.0.1:9099");
      var cred = await firebase.auth().signInAnonymously();
      uid = cred.user.uid;
      db = firebase.firestore();
      if (emu) db.useEmulator("127.0.0.1", 8080);
    } catch (e) { db = null; console.error(e); }
    route();
  }
  init();
})();
</script>
</body>
</html>

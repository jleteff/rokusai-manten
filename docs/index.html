<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1311">
<!-- The game is already dark: ask dark-mode browser extensions (Noir, Dark Reader, etc.) not to recolor it. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>六賽万点 · Six Dice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Sans:wght@400;500;700&family=Cairo:wght@400;600;700;800;900&display=swap">
<!-- Only the four title characters are downloaded from this font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E5%85%AD%E8%B3%BD%E4%B8%87%E7%82%B9%E6%92%83%E6%B2%88%E6%B1%BA%E6%88%A6&display=swap">
<style>
/* Layout: a felt card-room table seen from above. Players sit on the rail around it (you are always at the bottom seat),
   dice and the turn's pot sit in the middle, and your actions live in a bar under the table. */
:root {
  --room: #0b1311;
  --room-2: #131d1a;
  --line: #26352f;
  --felt: #0f6142;
  --felt-hi: #1a8458;
  --felt-lo: #0a442e;
  --rail: #3c2517;
  --rail-hi: #5c3a23;
  --gold: #e3b74e;
  --gold-dim: #a8873b;
  --ivory: #f4eedb;
  --ivory-dim: #a7b0a7;
  --ember: #ec5b3d;
  --ink: #1b1a17;
  --good: #8ad69d;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-jp: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-num: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--room); }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse 120% 70% at 50% 0%, #1a2a24 0%, var(--room) 62%) no-repeat, var(--room);
  color: var(--ivory);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: 0;
}
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--font-jp); font-weight: 400; font-size: 26px; line-height: 1; color: var(--gold); letter-spacing: .04em; white-space: nowrap; }
.brand span { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--room-2); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
.chip-btn .code { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .12em; color: var(--gold); }
.chip-btn .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }

/* buttons + inputs */
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; background: var(--gold); color: var(--ink); min-height: 50px; font-size: 16px; box-shadow: 0 3px 0 var(--gold-dim); }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dim); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ivory); border: 1.5px solid var(--line); box-shadow: none; }
.btn.ghost.danger { color: var(--ember); border-color: var(--ember); }
.btn.bank { background: var(--ivory); color: var(--ink); box-shadow: 0 3px 0 #b9b19a; }
.btn.hot { background: var(--ember); color: #fff; box-shadow: 0 3px 0 #9c3420; }
.btn.small { padding: 7px 12px; min-height: 36px; font-size: 13px; border-radius: 999px; }
.btn.pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
input[type=text], input[type=email], input[type=password], select {
  background: var(--room); color: var(--ivory); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 12px; font: inherit; min-height: 46px; width: 100%; min-width: 0;
}
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.muted { color: var(--ivory-dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--room-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

/* home */
.hero { text-align: center; padding: 22px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero h1 { font-family: var(--font-jp); font-weight: 400; font-size: clamp(54px, 17vw, 116px); line-height: 1.05; color: var(--gold); letter-spacing: .04em; text-shadow: 0 6px 0 #00000055; }
.hero .romaji { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .22em; text-transform: uppercase; color: var(--ivory); }
.hero p { color: var(--ivory-dim); max-width: 34ch; }
.hero-dice { display: flex; gap: 10px; margin-bottom: 6px; --d: 38px; }
.hero-dice .die { transform: rotate(var(--r)); }
.home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* the table */
/* the table is sized to the screen height too, so the whole game fits on a phone without scrolling */
.table { position: relative; width: min(100%, 500px, calc((100vh - 270px) * .75)); min-width: 290px; max-width: 100%; margin: 20px auto 10px; aspect-ratio: 3 / 4; --d: min(12.5vw, 54px); --sw: 86px; --av: 44px; }
@supports (height: 100dvh) { .table { width: min(100%, 500px, calc((100dvh - 270px) * .75)); } }
.table.wide { width: min(100%, 980px, calc((100vh - 230px) * 1.7778)); max-width: 980px; aspect-ratio: 16 / 9; --d: 62px; --sw: 112px; --av: 56px; margin-top: 30px; margin-bottom: 26px; }
.rail {
  position: absolute; inset: 8% 12%; border-radius: 50%;
  background: linear-gradient(160deg, var(--rail-hi), var(--rail) 55%, #24150c);
  border: 2px solid #1a0f08;
  box-shadow: 0 26px 50px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.08);
}
.table.wide .rail { inset: 10% 7%; }
.felt {
  position: absolute; inset: 7%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 42%, var(--felt-hi) 0%, var(--felt) 52%, var(--felt-lo) 100%);
  box-shadow: inset 0 0 0 2px rgba(227,183,78,.45), inset 0 12px 40px rgba(0,0,0,.5);
}
.table.wide .felt { inset: 9% 5%; }
.felt::after { content: ""; position: absolute; inset: 9%; border-radius: 50%; border: 1px solid rgba(255,255,255,.07); }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58%; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; z-index: 2; }
.table.wide .center { width: 52%; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: rgba(244,238,219,.75); }
.eyebrow.mine { color: var(--gold); }
.pot { display: flex; align-items: flex-end; justify-content: center; gap: 12px; }
.pot-n { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 10vw, 52px); line-height: .9; color: var(--ivory); font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.pot-l { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(244,238,219,.6); font-weight: 700; margin-top: -4px; }
.chips { position: relative; width: 26px; height: 9px; border-radius: 50%; background: var(--gold); margin-bottom: 4px; box-shadow: 0 -5px 0 #c0392b, 0 -10px 0 #f4eedb, 0 -15px 0 #2f6fd6, 0 -20px 0 var(--gold); }
.chips.empty { opacity: .25; }
.tray { display: grid; grid-template-columns: repeat(3, var(--d)); gap: calc(var(--d) * .22); justify-content: center; padding: 6px 0; }
.table.wide .tray { grid-template-columns: repeat(6, var(--d)); }
.stamp.jp { font-family: var(--font-jp); font-weight: 400; text-transform: none; letter-spacing: .04em; }
.stamp small { display: block; font-family: var(--font-display); font-size: .32em; letter-spacing: .2em; text-align: center; margin-top: -2px; }
.eyebrow.kessen { color: var(--ember); font-size: 13px; }
.stamp { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 11vw, 58px); color: var(--ember); border: 4px solid var(--ember); border-radius: 10px; padding: 0 14px; line-height: 1.05; text-transform: uppercase; transform: rotate(-7deg); background: rgba(10,20,16,.55); animation: stamp .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes stamp { from { transform: rotate(-7deg) scale(1.8); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
.winner-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(38px, 12vw, 70px); color: var(--gold); line-height: .95; text-transform: uppercase; overflow-wrap: anywhere; }
.lobby-code { font-family: var(--font-display); font-weight: 900; font-size: clamp(44px, 14vw, 72px); color: var(--gold); letter-spacing: .1em; line-height: 1; }
.center p.small { font-size: 13px; color: rgba(244,238,219,.8); max-width: 26ch; }

/* dice */
.die {
  width: var(--d); height: var(--d); border: 0; border-radius: 18%;
  background: linear-gradient(145deg, var(--die-a, #fffaea), var(--die-b, #e2d9bd)); padding: 0; display: block; position: relative;
  box-shadow: 0 4px 0 var(--die-edge, #a99f7f), 0 9px 14px rgba(0,0,0,.45);
  filter: drop-shadow(0 0 5px var(--die-glow, transparent));
  transition: transform .15s, box-shadow .15s;
}
.die svg { display: block; width: 100%; height: 100%; pointer-events: none; }
.die svg circle { fill: var(--pip, #15130f) !important; }
.die:disabled { cursor: default; }
.die.free:not(:disabled):hover { transform: translateY(-3px); }
.die.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px var(--gold), 0 14px 18px rgba(0,0,0,.5); }
.die.held { box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--die-edge, #a99f7f), 0 9px 14px rgba(0,0,0,.45); opacity: .72; }
.tray[data-skin="classic"] .die.held, .tray:not([data-skin]) .die.held { background: linear-gradient(145deg, #d8b860, #a8853a); box-shadow: 0 4px 0 #6e5520, 0 9px 14px rgba(0,0,0,.45); opacity: .85; }
.tray[data-skin="classic"] .die.held svg circle, .tray:not([data-skin]) .die.held svg circle { fill: #241c0b !important; }
.die.blank { opacity: .3; }
.die.bust { box-shadow: 0 0 0 3px var(--ember), 0 9px 14px rgba(0,0,0,.45); }
/* dice in flight (thrown from a seat, scooped by the dealer) */
.fly { position: fixed; z-index: 30; pointer-events: none; }
.fly .die { box-shadow: 0 6px 12px rgba(0,0,0,.5); }
.fly.cup { display: flex; gap: 3px; }
.fly.cup .die { width: 22px; height: 22px; border-radius: 5px; }
/* the dealer has her own seat at the head of the table */
.dealer-seat { --av-d: calc(var(--av) * 1.32); }
.dealer-seat .av { width: var(--av-d); height: var(--av-d); padding: 0; background: #3a0d18; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(227,183,78,.35), 0 8px 18px rgba(0,0,0,.6); }
.dealer-seat .av svg { width: 100%; height: 100%; display: block; }
.dealer-seat .plate { border-color: rgba(227,183,78,.5); }
.dealer-seat { cursor: pointer; }
.dealer-seat .eye-w { display: none; }
.dealer-seat .av.wink .eye-o { display: none; }
.dealer-seat .av.wink .eye-w { display: inline; }
/* menu: everything that isn't the table lives here */
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--room-2); display: grid; place-items: center; padding: 0; position: relative; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ivory); fill: none; stroke-width: 2; stroke-linecap: round; }
.menu-back { position: fixed; inset: 0; z-index: 42; background: rgba(0,0,0,.5); }
.menu { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 43; width: min(380px, 92vw); overflow-y: auto; overscroll-behavior: contain;
  background: var(--room-2); border-inline-start: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0,0,0,.6);
  padding: max(14px, env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.menu .panel { padding: 14px; background: var(--room); }
.menu-head { display: flex; justify-content: space-between; align-items: center; }
.menu-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.menu .code-big { font-family: var(--font-num); font-weight: 900; font-size: 34px; color: var(--gold); letter-spacing: .1em; }
/* dice cup: shakes at the roller's seat and pours the dice onto the felt */
.dicecup { position: fixed; z-index: 31; width: 48px; height: 58px; margin: -29px 0 0 -24px; pointer-events: none; transform-origin: 50% 60%; }
.dicecup .cupbody { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%);
  background: linear-gradient(90deg, #2e1a0e 0%, #7b4b27 38%, #a0683a 50%, #6a3f20 64%, #2a170b 100%); }
.dicecup .cupbody::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: linear-gradient(90deg, #8a6a24, #f0cf6e, #8a6a24); }
.dicecup .cupbody::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: 7px; height: 3px; background: rgba(227,183,78,.7); }
.dicecup.small { transform: scale(.6); }
/* challenges: Ro Sham Bo and quick 1-on-1 games */
.duel-back { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.duel { width: min(400px, 100%); background: var(--room-2); border: 1px solid var(--gold-dim); border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
.duel h3 { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; margin: 0 0 6px; }
.duel p { color: var(--ivory-dim); margin: 0 0 14px; }
.duel .stack { display: flex; flex-direction: column; gap: 8px; }
.duel .row { justify-content: center; }
.rps { display: flex; justify-content: center; gap: 12px; margin: 10px 0 14px; }
.rps button { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--line); background: var(--room); font-size: 40px; display: grid; place-items: center; padding: 0; }
.rps button:hover:not(:disabled) { border-color: var(--gold); }
.rps button:disabled { opacity: .35; }
.rps small { display: block; font-size: 12px; color: var(--ivory-dim); margin-top: 4px; }
.reveal { display: flex; justify-content: center; align-items: center; gap: 18px; font-size: 56px; margin: 6px 0 10px; }
.reveal span { animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
.reveal i { font-style: normal; font-size: 14px; color: var(--ivory-dim); }
.seat[data-act="seatmenu"] { cursor: pointer; }
.seat.bot-seat .av { font-size: calc(var(--av) * .5); opacity: .85; }
.auto-note { display: inline-block; margin-inline-start: 6px; font-size: 12px; color: var(--ivory-dim); white-space: nowrap; }
.badge .cd { font-variant-numeric: tabular-nums; }
.oldver { margin: 6px auto; max-width: 560px; font-size: 13px; text-align: center; color: var(--gold); background: rgba(7,12,10,.85); border: 1px solid var(--gold-dim); border-radius: 9px; padding: 6px 10px; }
.ok-check { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: var(--ink); background: var(--gold); }
.waiting-dot { color: var(--gold); margin-bottom: 12px; }
.grecaptcha-badge { visibility: hidden !important; }
.recap { margin-top: 14px; font-size: 12px; } .recap a { color: inherit; text-decoration: underline; }
/* coins, shop, cosmetics */
.coin { display: inline-block; width: 15px; height: 15px; border-radius: 50%; vertical-align: -2px; margin-inline-end: 4px; background: radial-gradient(circle at 35% 30%, #fff3b8, #e3b74e 45%, #a87b1c); box-shadow: inset 0 0 0 1.5px #8a6212; }
.coin.big { width: 22px; height: 22px; vertical-align: -5px; }
.coin-chip b { font-weight: 800; color: var(--gold); }
.coin-chip .lvl { white-space: nowrap; }
@media (max-width: 430px) {
  .topbtns { gap: 6px; }
  .topbtns .chip-btn { padding: 6px 9px; gap: 5px; }
  .coin-chip .lvl { display: none; }
  .brand b { font-size: 22px; }
}
.coin-chip .lvl { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 1px 6px; }
.coin-chip.ping { box-shadow: 0 0 0 2px var(--gold); animation: ping 1.6s ease-in-out infinite; }
@keyframes ping { 50% { box-shadow: 0 0 0 5px rgba(227,183,78,.25); } }
.menu.shop .prof-top { display: flex; align-items: center; gap: 12px; }
.prof-av { --av: 52px; flex: 0 0 auto; }
.prof-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prof-txt span { font-size: 13px; color: var(--ivory-dim); }
.prof-coins { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--gold); white-space: nowrap; }
.xpbar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 12px 0 6px; }
.xpbar span { display: block; height: 100%; background: linear-gradient(90deg, #a87b1c, var(--gold)); border-radius: 999px; }
.daily { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--room-2); }
.daily.ready { border-color: var(--gold); background: linear-gradient(135deg, rgba(227,183,78,.16), rgba(227,183,78,.04)); }
.tabs { display: flex; flex: 0 0 auto; gap: 6px; margin: 4px 0 12px; overflow-x: auto; }
.menu.shop > * { flex-shrink: 0; }
.tabs .tab { flex: 1 0 auto; border: 1px solid var(--line); background: transparent; color: var(--ivory); border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.tabs .tab[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; padding-bottom: 10px; }
.shop-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--room-2); text-align: center; }
.shop-item.on { border-color: var(--gold); }
.shop-item .si-name { font-size: 13px; font-weight: 700; min-height: 2.4em; display: flex; align-items: center; }
.shop-item .btn.small { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.shop-item .tag { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--gold-dim); color: var(--gold); }
.shop-item .tag.on { background: var(--gold); color: var(--ink); }
.shop-item .tag.lock { color: var(--ivory-dim); border-color: var(--line); }
.pv-die { width: 52px; height: 52px; border-radius: 18%; background: linear-gradient(145deg, var(--die-a), var(--die-b)); box-shadow: 0 3px 0 var(--die-edge), 0 6px 10px rgba(0,0,0,.4); filter: drop-shadow(0 0 5px var(--die-glow, transparent)); }
.pv-die svg { display: block; width: 100%; height: 100%; } .pv-die svg circle { fill: var(--pip) !important; }
.pv-felt { width: 76px; height: 52px; border-radius: 50%; background: radial-gradient(ellipse at 50% 42%, var(--felt-hi), var(--felt) 52%, var(--felt-lo)); box-shadow: inset 0 0 0 2px rgba(227,183,78,.45), 0 0 0 4px #3b2414; }
.pv-frame { --av: 52px; }
.pv-fx { padding: 6px; border-radius: 12px; } .pv-fx .pv-die { width: 44px; height: 44px; }
.fwrap { position: relative; display: inline-block; border-radius: 50%; padding: 3px; background: conic-gradient(var(--fr), var(--fr2), var(--fr)); }
.fwrap[data-glow="1"] { box-shadow: 0 0 12px var(--fr); }
.fwrap > .av { border-width: 2px; }
.prof-av[data-frame], .pv-frame[data-frame] { border-radius: 50%; padding: 3px; background: conic-gradient(var(--fr), var(--fr2), var(--fr)); display: inline-block; }
.pv-frame[data-glow="1"], .prof-av[data-glow="1"] { box-shadow: 0 0 12px var(--fr); }
.terms { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; font-size: 14px; line-height: 1.4; }
.terms input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--gold); }
.terms a, .legal a { color: var(--gold); }
.legal { text-align: center; color: var(--ivory-dim); margin: 4px 0 0; }

      dice += dieHTML(val, cls, i, !(canPick && !held));
    }

    var controls = "", hint = "", hintCls = "", tools = "";
    var who = "<bdi>" + esc(nameOf(cur)) + "</bdi>";
    if (done) {
      controls = room.host === uid ? '<button class="btn" data-act="again">' + T("Play again") + "</button>" : "";
      if (room.duelOf) controls = '<a class="btn" href="' + esc(duelLink(room.duelOf)) + '">' + T("Back to the main table") + "</a>";
      hint = room.duelOf ? "" : room.host === uid ? "" : T("Waiting for {name} to start another game.", { name: "<bdi>" + esc(nameOf(room.host)) + "</bdi>" });
    } else if (hold) {
      hint = mine ? T("Rolling…") : T("{name} is rolling. Watch the felt.", { name: who });
    } else if (!inGame) {
      hint = players[uid] ? T("You're waiting for {name} to let you in. You'll play from the next turn.", { name: "<bdi>" + esc(nameOf(room.host)) + "</bdi>" }) : T("You're watching this game.");
    } else if (mine && r.phase === "roll") {
      controls = '<button class="btn" data-act="roll"' + (busy ? " disabled" : "") + ">" + T("Roll the dice") + "</button>";
      hint = r.rolloff ? T("Your 決戦 turn: roll until 撃沈. The highest total wins.")
        : needToGoOut(r, uid) ? T("Your turn. You need exactly {n} to go out.", { n: fmt(needToGoOut(r, uid)) })
        : r.scores[uid] > 0 ? T("Your turn.") : T("Your turn. You need {n} this turn to get on the board.", { n: fmt(MIN_ENTRY) });
    } else if (mine && r.phase === "choose") {
      var rest = freeCount - selIdx.length, entryOk = (r.scores[cur] > 0) || total >= MIN_ENTRY;
      var over = !r.rolloff && (r.scores[cur] || 0) + total > r.target;   // no target limit in a 決戦
      controls = '<button class="btn" data-act="keeproll"' + (s.valid && s.score > 0 && !over && !busy ? "" : " disabled") + ">" + (rest === 0 && s.valid ? T("Hot dice: roll all 6") : T("Keep, roll {n}", { n: Math.max(rest, 0) })) + "</button>" +
        (r.rolloff ? "" : '<button class="btn bank" data-act="bank"' + (s.valid && s.score > 0 && entryOk && !over && !busy ? "" : " disabled") + ">" + T("Bank {n}", { n: fmt(total) }) + "</button>");
      if (!forced.length) tools = '<div class="tools"><button class="btn ghost small" data-act="autopick"' + (busy ? " disabled" : "") + ">" + T("Pick best dice") + "</button>" +
        '<button class="btn ghost small pill" data-act="autotoggle" aria-pressed="' + autoPick + '">' + T(autoPick ? "Auto-pick each roll: on" : "Auto-pick each roll: off") + "</button></div>";
      if (!selIdx.length) hint = T("Tap the scoring dice you want to keep.");
      else if (!s.valid) { hint = T("Every die you keep must score."); hintCls = "bad"; }
      else {
        hint = T("Keeping these is worth {n}.", { n: fmt(s.score) }); hintCls = "ok";
        if (!entryOk) hint += T(" You need {n} in a turn to get on the board.", { n: fmt(MIN_ENTRY) });
        if (over) { hint = T("That would put you over {n}. Keep fewer dice.", { n: fmt(r.target) }); hintCls = "bad"; }
        else if ((r.scores[cur] || 0) + total === r.target) hint += T(" That's exactly {n}. Bank it to win.", { n: fmt(r.target) });
        else if (needToGoOut(r, cur)) hint += T(" {n} left to go out after this.", { n: fmt(needToGoOut(r, cur) - total) });
      }
      if (forced.length) hint = T("{n}+ rule: every scoring die is kept for you. ", { n: fmt(r.target - 1000) }) + hint;
      if (r.rolloff) { hint = T("決戦: keep rolling until 撃沈. You have {n} so far.", { n: fmt(total) }); hintCls = selIdx.length && !s.valid ? "bad" : ""; }
    } else if (mine && r.phase === "farkle") {
      controls = '<button class="btn hot" data-act="pass"' + (busy ? " disabled" : "") + ">" + T("Pass the dice") + "</button>";
      hint = r.bust === "over" ? T("The dice you had to keep put you over {n}. Bust. The dice pass in a moment.", { n: fmt(r.target) }) : T("No scoring dice. The dice pass in a moment."); hintCls = "bad";
    } else {
      hint = r.phase === "farkle" ? (r.bust === "over" ? T("{name} went over {n}. Bust. Next player is up in a moment.", { name: who, n: fmt(r.target) }) : T("{name} sank: 撃沈! Next player is up in a moment.", { name: who }))
        : (r.phase === "choose" && selIdx.length && s.valid) ? T("{name} is keeping dice worth {n}.", { name: who, n: fmt(s.score) })
        : r.rolloff ? T("{name} is rolling in the 決戦.", { name: who })
        : T("{name} is rolling. Watch the felt.", { name: who });
    }
    if (mine && !done && (r.phase === "roll" || r.phase === "choose")) hint += ' <span class="auto-note">' + T("Auto-play in") + ' <span class="cd">' + T("{n}s", { n: secondsLeft() }) + "</span></span>";
    if (!done && room.host === uid && !mine) controls += '<button class="btn ghost small" data-act="skip">' + T("Skip {name}", { name: who }) + "</button>";

    var potValue = r.phase === "choose" ? total : r.turnScore;
    var center;
    if (done) {
      center = '<p class="eyebrow mine">' + T("Winner") + '</p><div class="winner-name">' + esc(nameOf(r.winner)) + "</div>" +
        '<p class="small">' + (r.winHow === "six" ? T("Rolled six of a kind in one throw.") : r.winHow === "kessen" ? T("Won the 決戦 roll-off.") : T("Landed on exactly {n}.", { n: fmt(r.target) })) + "</p>" + rewardHTML(r) + '<div class="tray" dir="ltr"' + trayAttrs(r.winner) + ">" + dice + "</div>";
    } else {
      var tag = r.rolloff ? "決戦 · " : r.finalFrom >= 0 ? T("Final round") + " · " : "";
      var head = r.phase === "farkle" ? (r.bust === "over" ? '<div class="stamp">' + T("Bust") + "</div>" : '<div class="stamp jp" lang="ja">撃沈<small>GEKICHIN</small></div>')
        : '<p class="eyebrow' + (mine ? " mine" : "") + (tag ? " kessen" : "") + '">' + tag + (mine ? T("Your turn") : T("{name}'s turn", { name: who })) + "</p>";
      center = head + '<div class="pot"><span class="chips' + (potValue ? "" : " empty") + '" aria-hidden="true"></span><span class="pot-n" id="pot" data-num="pot" data-to="' + potValue + '" data-tpl="pot">' + fmt(potValue) + "</span></div>" +
        '<p class="pot-l">' + T("This turn") + '</p><div class="tray" dir="ltr"' + trayAttrs(cur) + ">" + dice + "</div>";
    }
    var liveTotal = r.phase === "choose" ? total : (r.turnScore || 0);
    var seats = seatsHTML(r.order, { live: !done && !r.rolloff ? { id: cur, total: liveTotal } : null, cur: done ? null : cur, winner: done ? r.winner : null, scores: r.scores, curBadge: r.phase === "farkle" ? (r.bust === "over" ? "Bust" : "撃沈") : isBot(cur) ? "Thinking…" : r.auto === cur ? "On auto" : mine ? "Your turn" : "Rolling",
      countdown: !done && !isBot(cur) && (r.phase === "roll" || r.phase === "choose") });
    var log = (r.log || []).slice(-6).map(function (l) { return "<li>" + logLine(l) + "</li>"; }).join("");

    var waiting = room.host === uid && !done ? waitingIds().map(function (id) {
      return '<div class="waitrow"><span>' + T("{name} wants to play.", { name: "<strong><bdi>" + esc(nameOf(id)) + "</bdi></strong>" }) + '</span><button class="btn small" data-act="letin" data-id="' + esc(id) + '">' + T("Let in") + '</button><button class="btn ghost small" data-act="kick" data-id="' + esc(id) + '">' + T("Remove") + "</button></div>";
    }).join("") : "";
    return tableHTML(seats, center) +
      '<div class="actionbar">' + waiting + (controls ? '<div class="actions">' + controls + "</div>" : "") +
      '<p class="hint ' + hintCls + '" role="status">' + hint + "</p>" + tools + "</div>";
  }

  /* ---------- events ---------- */
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "authform") { e.preventDefault(); doAuth(); }
    if (e.target && e.target.id === "resetform") {
      e.preventDefault();
      var A = actState, pw = ($("#np") || {}).value || "";
      if (pw.length < 6) { A.msg = T("Use a password with at least 6 characters."); render(); return; }
      firebase.auth().confirmPasswordReset(A.code, pw).then(function () { A.status = "done"; A.msg = ""; render(); }, function (err) { A.msg = authMsg(err); render(); });
    }
  });
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    // A phone running an older version can watch and chat, but not play or change the game.
    if (staleApp() && /^(again|bank|bots|die|keeproll|pass|roll|skip|start|chal|duelgo|duelyes|rps)$/.test(a)) { render(); return; }
    if (a === "closeav" && el.classList.contains("sheet-back") && e.target !== el) return;   // taps inside the sheet
    if (a === "die") {
      if (animating) return;
      var i = Number(el.getAttribute("data-i"));
      if (sel.has(i)) sel.delete(i); else sel.add(i);
      backFromAuto(); scheduleAuto(true); sharePick(); render();
    } else if (a === "create") { var n = $("#nm"); myName = n.value.trim(); if (!myName) { n.focus(); return; } store.set("fk-name", myName); saveName(myName); createTable(); }
    else if (a === "join") { var c = $("#jc").value.trim().toUpperCase(); var nm = $("#nm") ? $("#nm").value.trim() : ""; if (nm) { myName = nm; store.set("fk-name", nm); } if (c) location.hash = "t-" + c; }
    else if (a === "setname") { var v = $("#nm").value.trim(); if (!v) return; myName = v; store.set("fk-name", v); saveName(v); maybeJoin(); render(); }
    else if (a === "authmode") { authMode = el.getAttribute("data-mode"); authErr = ""; authInfo = ""; render(); var f = $("#au-name") || $("#au-email"); if (f) f.focus(); }
    else if (a === "signout") signOut();
    else if (a === "filter") { filterOn = !filterOn; store.set("fk-filter", filterOn ? "1" : "0"); renderMenu(); renderChat(true); render(); }
    else if (a === "delacct") { delAsk = true; renderMenu(); }
    else if (a === "delno") { delAsk = false; renderMenu(); }
    else if (a === "delyes") {
      el.disabled = true;
      callFn("deleteAccount").then(function () { delAsk = false; toast(T("Your account was deleted.")); signOut(); }, function (e) { el.disabled = false; writeFail(e); });
    }
    else if (a === "resend") resendVerify();
    else if (a === "shop") { shopOpen = true; menuOpen = false; renderMenu(); renderShop(); }
    else if (a === "shopclose") { shopOpen = false; renderShop(); }
    else if (a === "shoptab") { shopTab = el.getAttribute("data-tab"); renderShop(); }
    else if (a === "buy") shopAct("buyItem", { id: el.getAttribute("data-id") }, function () { return T("Bought and equipped!"); });
    else if (a === "equip") shopAct("equip", { id: el.getAttribute("data-id") });
    else if (a === "iap") buyProduct(el.getAttribute("data-id"));
    else if (a === "restore") restorePurchases();
    else if (a === "tier") shopAct("claimTier", { n: Number(el.getAttribute("data-n")), track: el.getAttribute("data-t") }, function (d) { return d && d.item ? T("Unlocked {name}!", { name: itemName(CAT.byId[d.item]) }) : T("+{n} coins!", { n: fmt((d && d.coins) || 0) }); });
    else if (a === "daily") shopAct("claimDaily", {}, function (d) { return T("+{n} coins! Streak: {s} days.", { n: fmt((d && d.coins) || 0), s: (d && d.streak) || 1 }); });
    else if (a === "actclose") closeWindow(false);
    else if (a === "actdone") actionDone();
    else if (a === "lock") { if (room && room.host === uid) act(db.doc("rooms/" + code).update({ locked: room.locked !== true })); }
    else if (a === "kick") { var kid = el.getAttribute("data-id"); duelMenu = null; renderDuel(); removePlayer(kid); }
    else if (a === "letin") letIn(el.getAttribute("data-id"));
    else if (a === "autopick") { if (room && mineTurn(room) && room.phase === "choose") { sel = new Set(bestSel(room)); backFromAuto(); scheduleAuto(true); sharePick(); render(); } }
    else if (a === "autotoggle") {
      autoPick = !autoPick; store.set("fk-auto", autoPick ? "1" : "0");
      if (autoPick && room && mineTurn(room) && room.phase === "choose" && !sel.size) { sel = new Set(bestSel(room)); sharePick(); }
      render();
    }
    else if (a === "alerts") { alertsOn = !alertsOn; store.set("fk-alerts", alertsOn ? "1" : "0"); if (alertsOn) chime(); render(); }
    else if (a === "allownotif") {
      if (canNotify()) Promise.resolve(Notification.requestPermission()).then(function () { render(); }, function () { render(); });
    }
    else if (a === "testalert") {
      var was = alertsOn; alertsOn = true; chime();
      try { if (navigator.vibrate) navigator.vibrate([140, 80, 140]); } catch (err) {}
      if (canNotify() && Notification.permission === "granted") {
        var o = { body: T("This is what your turn alert looks like."), tag: "test", data: { url: location.href } };
        if (swReg && swReg.showNotification) swReg.showNotification(T("Your turn · 六賽万点"), o).catch(function () {});
        else { try { new Notification(T("Your turn · 六賽万点"), o); } catch (err) {} }
      } else toast(T("Chime played. Allow notifications to also get a pop-up."));
      alertsOn = was;
    }
    else if (a === "lang") { LANG = LANG === "ar" ? "en" : "ar"; store.set("fk-lang", LANG); applyLang(); avatarOpen && renderSheet(); renderChat(true); render(); }
    else if (a === "dealer") { dealerPick = dealerPick === "sofia" ? "layla" : "sofia"; store.set("fk-dealer", dealerPick); render(); }
    else if (a === "seatmenu") { duelMenu = el.getAttribute("data-id"); reportFor = null; renderDuel(); }
    else if (a === "reportmenu") { reportFor = el.getAttribute("data-id"); duelMenu = null; renderDuel(); }
    else if (a === "report") {
      var rid = el.getAttribute("data-id"), rnm = nameOf(rid), last = allChat().filter(function (m) { return m.id === rid; }).slice(-3).map(function (m) { return m.t; }).join(" / ");
      reportFor = null; renderDuel();
      callFn("report", { target: rid, reason: el.getAttribute("data-r"), room: code, name: rnm, note: last }).then(function () { toast(T("Thanks. The report was sent.")); }, writeFail);
    }
    else if (a === "block") {
      var bid = el.getAttribute("data-id"), on = !isBlocked(bid), bnm = nameOf(bid);
      duelMenu = null; renderDuel();
      callFn("block", { target: bid, on: on }).then(function () { toast(on ? T("{name} is blocked. You won't see their chat.", { name: bnm }) : T("{name} is unblocked.", { name: bnm })); }, writeFail);
    }
    else if (a === "chal") challenge(duelMenu, el.getAttribute("data-k"), Number(el.getAttribute("data-t")) || 0);
    else if (a === "duelyes") { var A1 = activeDuel(); if (A1) answerDuel(A1, true); }
    else if (a === "duelno") { var A2 = activeDuel(); if (A2) { answerDuel(A2, false); closeDuel(A2); } }
    else if (a === "rps") { var A3 = activeDuel(); if (A3) pickHand(A3, el.getAttribute("data-h")); }
    else if (a === "duelclose" && reportFor) { reportFor = null; renderDuel(); }
    else if (a === "duelclose") closeDuel(activeDuel());
    else if (a === "duelgo") { var A4 = activeDuel(); setTimeout(function () { closeDuel(A4); }, 300); }
    else if (a === "menu") { menuOpen = true; renderMenu(); }
    else if (a === "menuclose") { menuOpen = false; renderMenu(); }
    else if (a === "sound") { soundOn = !soundOn; store.set("fk-sound", soundOn ? "1" : "0"); if (soundOn) rollSound(300, [350]); renderMenu(); }
    else if (a === "chatopen") { menuOpen = false; renderMenu(); setChatOpen(true); }
    else if (a === "chatclose") setChatOpen(false);
    else if (a === "chatpop") { chatFloat = !chatFloat; store.set("fk-chatfloat", chatFloat ? "1" : "0"); applyChatMode(); }
    else if (a === "quick") sendChat(el.getAttribute("data-t"));
    else if (a === "avatar") { avatarOpen = true; renderSheet(); }
    else if (a === "closeav") { avatarOpen = false; renderSheet(); }
    else if (a === "setav") saveAvatar(el.getAttribute("data-v") || "");
    else if (a === "start") startGame();
    else if (a === "roll") doRoll();
    else if (a === "keeproll") commit("roll");
    else if (a === "bank") commit("bank");
    else if (a === "pass") pass();
    else if (a === "skip") pass("skip");
    else if (a === "again") playAgain();
    else if (a === "home") { menuOpen = false; location.hash = ""; route(); }
    else if (a === "copy") {
      var inp = $("#link");
      try { navigator.clipboard.writeText(inviteURL()).then(function () { toast(T("Invite link copied")); }, function () { if (inp) inp.select(); toast(T("Copy the selected link below")); }); }
      catch (err) { if (inp) inp.select(); toast(T("Copy the selected link below")); }
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "tg") setTarget(e.target.value);
    if (e.target.id === "avfile" && e.target.files && e.target.files[0]) shrinkPhoto(e.target.files[0]);
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    if (e.key === "Escape" && menuOpen) { menuOpen = false; renderMenu(); }
    else if (e.key === "Escape" && avatarOpen) { avatarOpen = false; renderSheet(); }
    else if (e.key === "Escape" && chatOpen) setChatOpen(false);
  });
  $("#chathead").addEventListener("pointerdown", function (e) {
    if (!chatFloat || e.target.closest("button")) return;
    clampChat();
    drag = { id: e.pointerId, dx: e.clientX - chatPos.x, dy: e.clientY - chatPos.y };
    e.currentTarget.setPointerCapture(e.pointerId); e.preventDefault();
  });
  $("#chathead").addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    chatPos.x = e.clientX - drag.dx; chatPos.y = e.clientY - drag.dy; clampChat();
  });
  var endDrag = function (e) { if (drag && e.pointerId === drag.id) { drag = null; saveChatPos(); } };
  $("#chathead").addEventListener("pointerup", endDrag);
  $("#chathead").addEventListener("pointercancel", endDrag);
  $("#chatsheet").addEventListener("mouseup", function () { if (chatFloat && !drag) saveChatPos(); });   // after a corner resize
  window.addEventListener("resize", clampChat);
  applyChatMode();
  $("#chatform").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("#chatin");
    if (sendChat(inp.value)) inp.value = "";
  });
  window.addEventListener("hashchange", route);
  var wasWide = isWide(), resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (isWide() !== wasWide) { wasWide = isWide(); render(); } }, 150);
  });

  // Browsers only let sound start after a tap, so unlock audio on the first one.
  document.addEventListener("pointerdown", function () {
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
  }, { passive: true });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { clearInterval(titleT); document.title = baseTitle; }
  });
  if ("serviceWorker" in navigator && !inApp()) navigator.serviceWorker.register("sw.js").then(function (r) { swReg = r; }, function () {});

  setInterval(tickCountdown, 500);

  /* ---------- boot ---------- */
  async function init() {
    applyLang();
    render();
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      var emu = /[?&]emulator=1/.test(location.search);
      // Bot protection: App Check proves each request comes from this real page in a real browser
      // (Google reCAPTCHA v3, invisible). Scripts and bots outside the page get turned away.
      if (!emu && !inApp() && window.APP_CHECK_KEY && firebase.appCheck) {
        try { firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(window.APP_CHECK_KEY), true); } catch (e) { console.error(e); }
      }
      if (emu) firebase.auth().useEmulator("http://127.0.0.1:9099");
      db = firebase.firestore();
      if (emu) { db.useEmulator("127.0.0.1", 8080); firebase.app().functions("us-central1").useEmulator("127.0.0.1", 5001); }
      if (actState) handleAction();
      // Confirming in another tab of this browser refreshes the sign-in quietly; catch that right away.
      firebase.auth().onIdTokenChanged(function (u) { if (u && verifyT) checkVerified(); });
      firebase.auth().onAuthStateChanged(function (u) {
        // Old guest (anonymous) sessions are signed out: every player needs an account now.
        if (u && u.isAnonymous) { firebase.auth().signOut(); return; }
        var was = uid;
        authUser = u; authReady = true; uid = u ? u.uid : null;
        if (u && u.displayName) { myName = u.displayName; store.set("fk-name", myName); }
        if (was !== uid) { unsubAll(); code = null; }
        route();
      });
    } catch (e) { db = null; console.error(e); render(); }
  }
  init();
})();
</script>
</body>
</html>

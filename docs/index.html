<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1311">
<title>六賽万点 · Six Dice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Sans:wght@400;500;700&display=swap">
<!-- Only the four title characters are downloaded from this font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E5%85%AD%E8%B3%BD%E4%B8%87%E7%82%B9&display=swap">
<style>
/* Layout: a felt card-room table seen from above. Players sit on the rail around it (you are always at the bottom seat),
   dice and the turn's pot sit in the middle, and your actions live in a bar under the table. */
:root {
  --room: #0b1311;
  --room-2: #131d1a;
  --line: #26352f;
  --felt: #0f6142;
  --felt-hi: #1a8458;
  --felt-lo: #0a442e;
  --rail: #3c2517;
  --rail-hi: #5c3a23;
  --gold: #e3b74e;
  --gold-dim: #a8873b;
  --ivory: #f4eedb;
  --ivory-dim: #a7b0a7;
  --ember: #ec5b3d;
  --ink: #1b1a17;
  --good: #8ad69d;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-jp: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--room); }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse 120% 70% at 50% 0%, #1a2a24 0%, var(--room) 62%) no-repeat, var(--room);
  color: var(--ivory);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: 0;
}
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--font-jp); font-weight: 400; font-size: 26px; line-height: 1; color: var(--gold); letter-spacing: .04em; }
.brand span { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--room-2); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
.chip-btn .code { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .12em; color: var(--gold); }
.chip-btn .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }

/* buttons + inputs */
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; background: var(--gold); color: var(--ink); min-height: 50px; font-size: 16px; box-shadow: 0 3px 0 var(--gold-dim); }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dim); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ivory); border: 1.5px solid var(--line); box-shadow: none; }
.btn.bank { background: var(--ivory); color: var(--ink); box-shadow: 0 3px 0 #b9b19a; }
.btn.hot { background: var(--ember); color: #fff; box-shadow: 0 3px 0 #9c3420; }
.btn.small { padding: 7px 12px; min-height: 36px; font-size: 13px; border-radius: 999px; }
.btn.pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
input[type=text], select {
  background: var(--room); color: var(--ivory); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 12px; font: inherit; min-height: 46px; width: 100%; min-width: 0;
}
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.muted { color: var(--ivory-dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--room-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

/* home */
.hero { text-align: center; padding: 22px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero h1 { font-family: var(--font-jp); font-weight: 400; font-size: clamp(54px, 17vw, 116px); line-height: 1.05; color: var(--gold); letter-spacing: .04em; text-shadow: 0 6px 0 #00000055; }
.hero .romaji { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .22em; text-transform: uppercase; color: var(--ivory); }
.hero p { color: var(--ivory-dim); max-width: 34ch; }
.hero-dice { display: flex; gap: 10px; margin-bottom: 6px; --d: 38px; }
.hero-dice .die { transform: rotate(var(--r)); }
.home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* the table */
.table { position: relative; width: 100%; max-width: 500px; margin: 22px auto 14px; aspect-ratio: 3 / 4; --d: min(12.5vw, 54px); --sw: 86px; --av: 44px; }
.table.wide { max-width: 980px; aspect-ratio: 16 / 9; --d: 62px; --sw: 112px; --av: 56px; margin-top: 30px; margin-bottom: 26px; }
.rail {
  position: absolute; inset: 8% 12%; border-radius: 50%;
  background: linear-gradient(160deg, var(--rail-hi), var(--rail) 55%, #24150c);
  border: 2px solid #1a0f08;
  box-shadow: 0 26px 50px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.08);
}
.table.wide .rail { inset: 10% 7%; }
.felt {
  position: absolute; inset: 7%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 42%, var(--felt-hi) 0%, var(--felt) 52%, var(--felt-lo) 100%);
  box-shadow: inset 0 0 0 2px rgba(227,183,78,.45), inset 0 12px 40px rgba(0,0,0,.5);
}
.table.wide .felt { inset: 9% 5%; }
.felt::after { content: ""; position: absolute; inset: 9%; border-radius: 50%; border: 1px solid rgba(255,255,255,.07); }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58%; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; z-index: 2; }
.table.wide .center { width: 52%; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: rgba(244,238,219,.75); }
.eyebrow.mine { color: var(--gold); }
.pot { display: flex; align-items: flex-end; justify-content: center; gap: 12px; }
.pot-n { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 10vw, 52px); line-height: .9; color: var(--ivory); font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.pot-l { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(244,238,219,.6); font-weight: 700; margin-top: -4px; }
.chips { position: relative; width: 26px; height: 9px; border-radius: 50%; background: var(--gold); margin-bottom: 4px; box-shadow: 0 -5px 0 #c0392b, 0 -10px 0 #f4eedb, 0 -15px 0 #2f6fd6, 0 -20px 0 var(--gold); }
.chips.empty { opacity: .25; }
.tray { display: grid; grid-template-columns: repeat(3, var(--d)); gap: calc(var(--d) * .22); justify-content: center; padding: 6px 0; }
.table.wide .tray { grid-template-columns: repeat(6, var(--d)); }
.stamp { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 11vw, 58px); color: var(--ember); border: 4px solid var(--ember); border-radius: 10px; padding: 0 14px; line-height: 1.05; text-transform: uppercase; transform: rotate(-7deg); background: rgba(10,20,16,.55); animation: stamp .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes stamp { from { transform: rotate(-7deg) scale(1.8); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
.winner-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(38px, 12vw, 70px); color: var(--gold); line-height: .95; text-transform: uppercase; overflow-wrap: anywhere; }
.lobby-code { font-family: var(--font-display); font-weight: 900; font-size: clamp(44px, 14vw, 72px); color: var(--gold); letter-spacing: .1em; line-height: 1; }
.center p.small { font-size: 13px; color: rgba(244,238,219,.8); max-width: 26ch; }

/* dice */
.die {
  width: var(--d); aspect-ratio: 1; border: 0; border-radius: 18%;
  background: linear-gradient(145deg, #fffaea, #e2d9bd); padding: 14%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%;
  box-shadow: 0 4px 0 #a99f7f, 0 9px 14px rgba(0,0,0,.45);
  transition: transform .15s, box-shadow .15s;
}
.die i { border-radius: 50%; }
.die i.on { background: var(--ink); box-shadow: inset 0 2px 2px rgba(0,0,0,.5); }
.die:disabled { cursor: default; }
.die.free:not(:disabled):hover { transform: translateY(-3px); }
.die.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px var(--gold), 0 14px 18px rgba(0,0,0,.5); }
.die.held { background: linear-gradient(145deg, #d8b860, #a8853a); box-shadow: 0 4px 0 #6e5520, 0 9px 14px rgba(0,0,0,.45); opacity: .85; }
.die.held i.on { background: #2a2210; }
.die.blank { opacity: .3; }
.die.bust { box-shadow: 0 0 0 3px var(--ember), 0 9px 14px rgba(0,0,0,.45); }
/* dice in flight (thrown from a seat, scooped by the dealer) */
.fly { position: fixed; z-index: 30; pointer-events: none; }
.fly .die { box-shadow: 0 6px 12px rgba(0,0,0,.5); }
.fly.cup { display: flex; gap: 3px; }
.fly.cup .die { width: 22px; padding: 3px; border-radius: 5px; }
.dealer {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; margin-top: 2px;
  background: radial-gradient(circle at 40% 35%, #ffffff, #e7e0c9 70%); color: var(--ink);
  font-size: 7.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  box-shadow: inset 0 0 0 3px #cfc7ab, inset 0 0 0 5px #fff, 0 4px 8px rgba(0,0,0,.45);
}
.table.wide .dealer { width: 50px; height: 50px; font-size: 8.5px; }

/* seats */
.seat { position: absolute; transform: translate(-50%, -50%); width: var(--sw); display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 3; text-align: center; }
.av {
  overflow: hidden; flex: 0 0 auto;
  width: var(--av); height: var(--av); border-radius: 50%; background: var(--c, #555); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--av) * .42);
  border: 3px solid #0c1411; box-shadow: 0 6px 14px rgba(0,0,0,.55); letter-spacing: .02em;
}
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: calc(var(--av) * .55); background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 55%, #fff), var(--c)); }
.seat.me[data-act] { cursor: pointer; }
.seat.me[data-act]:hover .av { outline: 2px dashed rgba(244,238,219,.5); outline-offset: 3px; }
.plate { background: rgba(7,12,10,.9); border: 1px solid var(--line); border-radius: 9px; padding: 3px 8px 4px; min-width: 70px; max-width: var(--sw); }
.plate .nm { display: block; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .sc { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.05; }
.table.wide .plate .nm { font-size: 13px; }
.table.wide .plate .sc { font-size: 21px; }
.seat.me .plate { border-color: rgba(244,238,219,.35); }
.seat.turn .av { border-color: var(--gold); animation: glow 1.6s ease-in-out infinite; }
.seat.turn .plate { border-color: var(--gold); }
.seat.win .av { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(227,183,78,.4), 0 0 30px rgba(227,183,78,.7); }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 3px rgba(227,183,78,.25), 0 0 14px rgba(227,183,78,.35); } 50% { box-shadow: 0 0 0 6px rgba(227,183,78,.4), 0 0 28px rgba(227,183,78,.7); } }
.badge { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); z-index: 1; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; background: var(--gold); color: var(--ink); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.badge.off { background: var(--room-2); color: var(--ivory-dim); border: 1px solid var(--line); }
.seat.open .av { background: rgba(0,0,0,.25); border: 2px dashed rgba(244,238,219,.25); color: rgba(244,238,219,.4); box-shadow: none; }
.seat.open .plate { opacity: .55; }

/* action bar */
.actionbar {
  position: sticky; bottom: 0; z-index: 5; width: 100%; max-width: 620px; margin: 0 auto;
  padding: 14px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--room) 78%, rgba(11,19,17,0));
  display: flex; flex-direction: column; gap: 8px; align-items: stretch;
}
.actions { display: flex; gap: 10px; }
.actions .btn:not(.small) { flex: 1 1 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.hint { text-align: center; min-height: 20px; font-size: 14px; }
.hint.bad { color: var(--ember); }
.hint.ok { color: var(--good); }
.status-line { text-align: center; color: var(--ivory-dim); }

/* below the table */
.below { width: 100%; max-width: 620px; margin: 6px auto 28px; display: flex; flex-direction: column; gap: 12px; }
.log { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ivory-dim); }
.log li:last-child { color: var(--ivory); }
.invite { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.invite input { flex: 1 1 200px; }
details summary { cursor: pointer; font-weight: 700; }
.rules { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--ivory-dim); display: flex; flex-direction: column; gap: 4px; }
.kinds { overflow-x: auto; margin-top: 12px; }
.kinds table { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 300px; font-variant-numeric: tabular-nums; }
.kinds th, .kinds td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); }
.kinds th:first-child { text-align: left; }
.kinds thead th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ivory-dim); font-weight: 700; }
.kinds td { color: var(--gold); }

/* avatar picker */
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: grid; place-items: end center; }
.sheet { width: min(560px, 100%); max-height: 86vh; overflow: auto; background: var(--room-2); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet-back { place-items: center; } .sheet { border-radius: 18px; } }
.av-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.av-opt { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--room); padding: 0; display: grid; place-items: center;
  font-size: clamp(22px, 6vw, 30px); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.av-opt[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(227,183,78,.35); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.home-av { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; --av: 48px; }
.home-av button { border: 0; background: none; padding: 0; border-radius: 50%; }
/* rulebook: basics first, detail further down */
.rules-sec h4 { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); margin: 16px 0 2px; }
ol.rules { padding-left: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ivory); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; max-width: calc(100vw - 32px); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

@media (max-width: 640px) {
  .home-cards { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .brand span { display: none; }
  .chip-btn .lbl.inv { display: none; }
}
/* chat: speech bubbles over seats, plus a drawer with the whole conversation */
.topbtns { display: flex; gap: 8px; align-items: center; }
.chip-btn { position: relative; }
.chip-btn .dot { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--ember); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.chip-btn .chat-lbl { font-size: 13px; font-weight: 700; color: var(--ivory); }
.bubble {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); z-index: 6;
  width: max-content; max-width: 160px; padding: 5px 10px; border-radius: 14px; background: var(--ivory); color: var(--ink);
  font-size: 12.5px; font-weight: 700; line-height: 1.3; text-align: center; overflow-wrap: anywhere;
  box-shadow: 0 6px 16px rgba(0,0,0,.5); animation: pop .25s cubic-bezier(.2,1.5,.4,1);
}
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--ivory); }
.bubble.down { bottom: auto; top: calc(100% + 8px); }
.bubble.down::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: var(--ivory); }
@keyframes pop { from { transform: translateX(-50%) scale(.4); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
.chat-sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 35; width: min(560px, 100%); height: min(64vh, 560px);
  transform: translate(-50%, 104%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s;
  display: flex; flex-direction: column; background: var(--room-2); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
  box-shadow: 0 -20px 50px rgba(0,0,0,.6); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.chat-sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease; }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chat-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.chat-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; --av: 30px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg .who { display: block; font-size: 11px; font-weight: 700; color: var(--ivory-dim); margin: 0 4px 2px; }
.msg.me .who { text-align: right; }
.msg .txt { display: inline-block; background: var(--room); border: 1px solid var(--line); border-radius: 14px; padding: 7px 11px; overflow-wrap: anywhere; }
.msg.me .txt { background: var(--gold); color: var(--ink); border-color: transparent; }
.chat-empty { margin: auto; text-align: center; color: var(--ivory-dim); font-size: 14px; max-width: 30ch; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: none; }
.quick .btn { flex: 0 0 auto; }
.chat-form { display: flex; gap: 8px; padding: 10px 16px 12px; }
.chat-form input { flex: 1 1 auto; }
@media (prefers-reduced-motion: reduce) {
  .die.tumble, .stamp, .seat.turn .av { animation: none; }
  .die, .btn { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand" lang="ja"><b>六賽万点</b><span lang="en">Six Dice · 10,000</span></div>
    <div id="topright"></div>
  </div>
  <div id="warn"></div>
  <div id="view"><div class="panel muted">Connecting…</div></div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="sheet"></div>
<div class="chat-sheet" id="chatsheet" role="dialog" aria-label="Table chat">
  <div class="chat-head"><h2>Table talk</h2><button class="btn ghost small" type="button" data-act="chatclose">Close</button></div>
  <div class="chat-list" id="chatlist" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form class="chat-form" id="chatform"><input id="chatin" type="text" maxlength="200" placeholder="Talk some trash…" autocomplete="off" enterkeyhint="send" aria-label="Chat message"><button class="btn small" type="submit">Send</button></form>

    animating = true;
    Array.prototype.forEach.call(dice, function (d, k) {
      var to = centerOf(d), dx = from.x - to.x, dy = from.y - to.y;
      var mx = dx * 0.32 + (Math.random() * 60 - 30), my = dy * 0.32 + (Math.random() * 40 - 20);
      var spin = (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 360), rest = Math.random() * 24 - 12;

    } else {
      hint = r.phase === "farkle" ? esc(nameOf(cur)) + (r.bust === "over" ? " went over " + r.target.toLocaleString() + ". Bust." : " farkled.") + " Next player is up in a moment."
        : (r.phase === "choose" && selIdx.length && s.valid) ? esc(nameOf(cur)) + " is keeping dice worth " + s.score.toLocaleString() + "."
        : esc(nameOf(cur)) + " is rolling. Watch the felt.";
    }
    if (!done && room.host === uid && !mine) controls += '<button class="btn ghost small" data-act="skip">Skip ' + esc(nameOf(cur)) + "</button>";

    var potValue = r.phase === "choose" ? total : r.turnScore;
    var center;
    if (done) {
      center = '<p class="eyebrow mine">Winner</p><div class="winner-name">' + esc(nameOf(r.winner)) + "</div>" +
        '<p class="small">' + (r.winHow === "six" ? "Rolled six of a kind in one throw." : "Landed on exactly " + r.target.toLocaleString() + ".") + "</p>" + '<div class="tray">' + dice + "</div>";
    } else {
      var head = r.phase === "farkle" ? '<div class="stamp">' + (r.bust === "over" ? "Bust" : "Farkle") + "</div>"
        : '<p class="eyebrow' + (mine ? " mine" : "") + '">' + (mine ? "Your turn" : esc(nameOf(cur)) + "'s turn") + "</p>";
      center = head + '<div class="pot"><span class="chips' + (potValue ? "" : " empty") + '" aria-hidden="true"></span><span class="pot-n" id="pot">' + potValue.toLocaleString() + "</span></div>" +
        '<p class="pot-l">This turn</p><div class="tray">' + dice + "</div>" + '<div class="dealer" id="dealer" aria-hidden="true">Dealer</div>';
    }
    var seats = seatsHTML(r.order, { cur: done ? null : cur, winner: done ? r.winner : null, scores: r.scores, curBadge: r.phase === "farkle" ? (r.bust === "over" ? "Bust" : "Farkled") : mine ? "Your turn" : "Rolling" });
    var log = (r.log || []).slice(-6).map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("");

    return tableHTML(seats, center) +
      '<div class="actionbar">' + (controls ? '<div class="actions">' + controls + "</div>" : "") +
      '<p class="hint ' + hintCls + '" role="status">' + hint + "</p>" + tools + "</div>" +
      '<div class="below"><div class="panel"><p class="label">Game log · race to ' + r.target.toLocaleString() + ' exactly</p><ul class="log">' + log + "</ul></div>" +
      '<div class="panel"><p class="label">Invite link</p>' + inviteHTML() + "</div>" +
      '<div class="panel">' + rulesHTML() + "</div></div>";
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "closeav" && el.classList.contains("sheet-back") && e.target !== el) return;   // taps inside the sheet
    if (a === "die") {
      if (animating) return;
      var i = Number(el.getAttribute("data-i"));
      if (sel.has(i)) sel.delete(i); else sel.add(i);
      sharePick(); render();
    } else if (a === "create") { var n = $("#nm"); myName = n.value.trim(); if (!myName) { n.focus(); return; } store.set("fk-name", myName); createTable(); }
    else if (a === "join") { var c = $("#jc").value.trim().toUpperCase(); var nm = $("#nm") ? $("#nm").value.trim() : ""; if (nm) { myName = nm; store.set("fk-name", nm); } if (c) location.hash = "t-" + c; }
    else if (a === "setname") { var v = $("#nm").value.trim(); if (!v) return; myName = v; store.set("fk-name", v); maybeJoin(); render(); }
    else if (a === "autopick") { if (room && mineTurn(room) && room.phase === "choose") { sel = new Set(bestSel(room)); sharePick(); render(); } }
    else if (a === "autotoggle") {
      autoPick = !autoPick; store.set("fk-auto", autoPick ? "1" : "0");
      if (autoPick && room && mineTurn(room) && room.phase === "choose" && !sel.size) { sel = new Set(bestSel(room)); sharePick(); }
      render();
    }
    else if (a === "chatopen") setChatOpen(true);
    else if (a === "chatclose") setChatOpen(false);
    else if (a === "quick") sendChat(el.getAttribute("data-t"));
    else if (a === "avatar") { avatarOpen = true; renderSheet(); }
    else if (a === "closeav") { avatarOpen = false; renderSheet(); }
    else if (a === "setav") saveAvatar(el.getAttribute("data-v") || "");
    else if (a === "start") startGame();
    else if (a === "roll") doRoll();
    else if (a === "keeproll") commit("roll");
    else if (a === "bank") commit("bank");
    else if (a === "pass") pass();
    else if (a === "skip") pass("skip");
    else if (a === "again") playAgain();
    else if (a === "home") { location.hash = ""; route(); }
    else if (a === "copy") {
      var inp = $("#link");
      try { navigator.clipboard.writeText(location.href).then(function () { toast("Invite link copied"); }, function () { if (inp) inp.select(); toast("Copy the selected link below"); }); }
      catch (err) { if (inp) inp.select(); toast("Copy the selected link below"); }
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "tg") setTarget(e.target.value);
    if (e.target.id === "avfile" && e.target.files && e.target.files[0]) shrinkPhoto(e.target.files[0]);
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    if (e.key === "Escape" && avatarOpen) { avatarOpen = false; renderSheet(); }
    else if (e.key === "Escape" && chatOpen) setChatOpen(false);
  });
  $("#chatform").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("#chatin");
    if (sendChat(inp.value)) inp.value = "";
  });
  window.addEventListener("hashchange", route);
  var wasWide = isWide(), resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (isWide() !== wasWide) { wasWide = isWide(); render(); } }, 150);
  });

  /* ---------- boot ---------- */
  async function init() {
    render();
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      var emu = /[?&]emulator=1/.test(location.search);
      if (emu) firebase.auth().useEmulator("http://127.0.0.1:9099");
      var cred = await firebase.auth().signInAnonymously();
      uid = cred.user.uid;
      db = firebase.firestore();
      if (emu) db.useEmulator("127.0.0.1", 8080);
    } catch (e) { db = null; console.error(e); }
    route();
  }
  init();
})();
</script>
</body>
</html>
